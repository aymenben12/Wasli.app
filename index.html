<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وصلي</title>
<style>
* {
  box-sizing: border-box;
}

:root {
  --primary: #ff5538;
  --primary-dark: #e94328;
  --bg: #f6f7f9;
  --card: #ffffff;
  --text: #17181c;
  --muted: #7b7e86;
  --border: #e7e8ec;
  --green: #16a56a;
  --red: #e53935;
  --yellow: #f5a623;
  --shadow: 0 8px 30px rgba(0,0,0,.07);
  --radius: 18px;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, "Noto Sans Arabic", sans-serif;
}

body {
  direction: rtl;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

[hidden] {
  display: none !important;
}

.screen {
  min-height: 100vh;
}

/* ================= SPLASH ================= */

.splash-screen {
  background: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.splash-logo,
.brand-logo {
  width: 125px;
  height: 125px;
  border-radius: 34px;
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 60px;
  font-weight: 900;
  box-shadow: 0 15px 40px rgba(255,85,56,.25);
}

.splash-screen h1 {
  font-size: 46px;
  margin: 28px 0 5px;
}

.splash-screen p,
.brand p {
  color: var(--muted);
  font-size: 19px;
}

/* ================= LOGIN ================= */

.login-screen {
  padding: 35px 16px 50px;
  background:
    radial-gradient(circle at top, rgba(255,85,56,.09), transparent 40%),
    var(--bg);
}

.brand {
  text-align: center;
}

.brand-logo {
  width: 100px;
  height: 100px;
  margin: 0 auto 20px;
  border-radius: 28px;
  font-size: 48px;
}

.brand h1 {
  font-size: 42px;
  margin: 0;
}

.brand p {
  margin: 8px 0 22px;
}

.language-switch {
  display: flex;
  gap: 8px;
  max-width: 460px;
  margin: 0 auto 15px;
}

.lang-btn {
  flex: 1;
  border: 0;
  border-radius: 14px;
  padding: 13px;
  background: #eeeef0;
  color: #444;
}

.lang-btn.active {
  background: var(--primary);
  color: #fff;
}

.login-card {
  max-width: 460px;
  margin: auto;
  background: var(--card);
  padding: 22px;
  border-radius: 25px;
  box-shadow: var(--shadow);
}

.login-card h2 {
  margin: 0 0 6px;
  font-size: 26px;
}

.muted {
  color: var(--muted);
  margin-top: 0;
}

.role-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 18px 0;
}

.role-card {
  border: 2px solid var(--border);
  background: #fff;
  border-radius: 15px;
  padding: 12px 5px;
  color: var(--text);
}

.role-card.active {
  border-color: var(--primary);
  background: rgba(255,85,56,.07);
}

.role-icon {
  display: block;
  font-size: 27px;
  margin-bottom: 6px;
}

.role-card strong,
.role-card small {
  display: block;
}

.role-card small {
  color: var(--muted);
  margin-top: 4px;
  font-size: 11px;
}

.field {
  margin-bottom: 14px;
}

.field label {
  display: block;
  font-weight: 700;
  margin-bottom: 7px;
  font-size: 14px;
}

.field input,
.field textarea,
.field select {
  width: 100%;
  border: 1px solid var(--border);
  background: #fafafa;
  border-radius: 13px;
  padding: 13px;
  outline: none;
}

.field textarea {
  min-height: 85px;
  resize: vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus {
  border-color: var(--primary);
  background: #fff;
}

.primary-btn {
  border: 0;
  border-radius: 14px;
  padding: 13px 18px;
  background: var(--primary);
  color: #fff;
  font-weight: 800;
}

.primary-btn:hover {
  background: var(--primary-dark);
}

.full {
  width: 100%;
}

.demo-note {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 0;
}

/* ================= APP ================= */

.app-screen {
  min-height: 100vh;
  padding-bottom: 78px;
}

.topbar {
  background: #fff;
  padding: 15px 17px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}

.topbar small {
  color: var(--muted);
}

.location-btn {
  display: block;
  border: 0;
  background: transparent;
  padding: 4px 0;
  font-weight: 800;
  color: var(--text);
}

.icon-btn {
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 12px;
  background: #f0f1f4;
}

.main-content,
.dashboard-content {
  max-width: 900px;
  margin: auto;
  padding: 18px 15px;
}

.hero {
  background: linear-gradient(135deg, #ff5538, #ff765e);
  color: #fff;
  padding: 22px;
  border-radius: 22px;
  margin-bottom: 18px;
}

.hero h2 {
  margin: 0 0 8px;
  font-size: 25px;
}

.hero p {
  margin: 0;
  opacity: .9;
}

.search-box {
  position: relative;
  margin-bottom: 18px;
}

.search-box input {
  width: 100%;
  border: 0;
  background: #fff;
  box-shadow: var(--shadow);
  border-radius: 15px;
  padding: 15px 45px 15px 15px;
  outline: none;
}

.search-box span {
  position: absolute;
  right: 15px;
  top: 13px;
  font-size: 20px;
}

.categories {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 7px;
  margin-bottom: 17px;
}

.category-btn {
  flex: 0 0 auto;
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 20px;
  padding: 9px 15px;
}

.category-btn.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 20px 0 12px;
}

.section-title h3 {
  margin: 0;
}

.restaurant-card {
  background: #fff;
  border-radius: 20px;
  margin-bottom: 18px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.restaurant-head {
  padding: 15px;
  background: #fff7f5;
}

.restaurant-head h3 {
  margin: 0 0 4px;
}

.restaurant-head small {
  color: var(--muted);
}

.food-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 10px;
}

.food-card {
  border: 1px solid var(--border);
  border-radius: 15px;
  overflow: hidden;
  background: #fff;
}

.food-image {
  width: 100%;
  height: 115px;
  object-fit: cover;
  background: #eee;
}

.food-body {
  padding: 10px;
}

.food-body h4 {
  margin: 0 0 5px;
}

.food-body p {
  color: var(--muted);
  font-size: 12px;
  min-height: 30px;
  margin: 0 0 8px;
}

.price-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 5px;
}

.price {
  font-weight: 900;
  color: var(--primary);
}

.add-btn {
  border: 0;
  background: var(--primary);
  color: #fff;
  border-radius: 10px;
  padding: 8px 11px;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav {
  position: fixed;
  bottom: 0;
  right: 0;
  left: 0;
  height: 70px;
  background: rgba(255,255,255,.97);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  z-index: 20;
}

.nav-btn {
  position: relative;
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--muted);
}

.nav-btn span,
.nav-btn small {
  display: block;
}

.nav-btn span {
  font-size: 21px;
}

.nav-btn small {
  font-size: 11px;
  margin-top: 3px;
}

.nav-btn.active {
  color: var(--primary);
}

.badge {
  position: absolute;
  top: 5px;
  right: 30%;
  background: var(--red);
  color: #fff;
  border-radius: 20px;
  padding: 2px 6px;
  font-size: 10px;
}

/* ================= ORDERS ================= */

.order-card {
  background: #fff;
  border-radius: 18px;
  padding: 15px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}

.order-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.order-head h3 {
  margin: 0 0 4px;
}

.order-items {
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  margin: 12px 0;
  padding: 10px 0;
}

.order-item {
  display: flex;
  justify-content: space-between;
  margin: 6px 0;
}

.status {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 20px;
  background: #eee;
  font-size: 11px;
  font-weight: 800;
}

.status.confirmed,
.status.done {
  background: #e3f7ed;
  color: var(--green);
}

.status.rejected {
  background: #ffebeb;
  color: var(--red);
}

.status.onWay {
  background: #e7f0ff;
  color: #2367c9;
}

.status.waiting {
  background: #fff4d9;
  color: #a56a00;
}

.info-box {
  background: #f7f7f8;
  border-radius: 12px;
  padding: 11px;
  margin-top: 10px;
  font-size: 13px;
}

.action-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.action-btn {
  flex: 1;
  min-width: 100px;
  border: 0;
  border-radius: 11px;
  padding: 10px;
  font-weight: 700;
}

.action-green {
  background: #e2f7ed;
  color: var(--green);
}

.action-red {
  background: #ffebeb;
  color: var(--red);
}

.action-dark {
  background: #25262a;
  color: #fff;
}

/* ================= PROFILE ================= */

.profile-card {
  background: #fff;
  padding: 20px;
  border-radius: 20px;
  box-shadow: var(--shadow);
}

.profile-avatar {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  margin-bottom: 12px;
}

/* ================= DASHBOARD ================= */

.dashboard-header {
  background: #fff;
  padding: 17px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.dashboard-header small {
  color: var(--muted);
}

.dashboard-header h2 {
  margin: 4px 0 0;
}

.logout-btn {
  border: 0;
  border-radius: 11px;
  padding: 10px;
  background: #ffeded;
  color: var(--red);
  font-weight: 700;
}

.dashboard-tabs {
  background: #fff;
  display: flex;
  border-bottom: 1px solid var(--border);
}

.dash-tab {
  flex: 1;
  border: 0;
  background: transparent;
  padding: 14px;
  color: var(--muted);
  border-bottom: 3px solid transparent;
}

.dash-tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}

.food-admin-card {
  display: flex;
  gap: 12px;
  background: #fff;
  padding: 12px;
  border-radius: 15px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
}

.food-admin-card img {
  width: 85px;
  height: 85px;
  border-radius: 12px;
  object-fit: cover;
}

.food-admin-info {
  flex: 1;
}

.food-admin-info h4 {
  margin: 0 0 5px;
}

.food-admin-info p {
  color: var(--muted);
  font-size: 12px;
  margin: 0 0 6px;
}

.admin-actions {
  display: flex;
  gap: 5px;
}

.small-btn {
  border: 0;
  border-radius: 8px;
  padding: 6px 9px;
  font-size: 11px;
}

.edit-btn {
  background: #edf3ff;
  color: #2864c7;
}

.delete-btn {
  background: #ffeded;
  color: var(--red);
}

.add-food-btn {
  margin-bottom: 15px;
}

/* ================= DRIVER ================= */

.driver-status {
  background: #fff;
  padding: 15px;
  border-radius: 18px;
  box-shadow: var(--shadow);
  margin-bottom: 15px;
}

.online-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.switch {
  position: relative;
  width: 54px;
  height: 30px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  inset: 0;
  background: #ccc;
  border-radius: 30px;
  transition: .2s;
}

.slider:before {
  content: "";
  position: absolute;
  width: 22px;
  height: 22px;
  right: 4px;
  top: 4px;
  background: #fff;
  border-radius: 50%;
  transition: .2s;
}

.switch input:checked + .slider {
  background: var(--green);
}

.switch input:checked + .slider:before {
  transform: translateX(-24px);
}

/* ================= RATING ================= */

.rating-box {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.rating-title {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 7px;
}

.stars {
  display: flex;
  gap: 5px;
  direction: ltr;
}

.star {
  border: 0;
  background: transparent;
  font-size: 25px;
  padding: 0;
  filter: grayscale(1);
}

.star.selected {
  filter: grayscale(0);
}

/* ================= MODAL ================= */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.modal-box {
  background: #fff;
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
  border-radius: 25px 25px 0 0;
  padding: 20px;
}

.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 15px;
}

.modal-head h3 {
  margin: 0;
}

.close-btn {
  width: 38px;
  height: 38px;
  border: 0;
  border-radius: 50%;
  background: #f0f1f3;
  font-size: 25px;
}

/* ================= CART ================= */

.cart-line {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  padding: 12px;
  border-radius: 14px;
  margin-bottom: 8px;
}

.cart-line-info {
  flex: 1;
}

.qty-controls {
  display: flex;
  align-items: center;
  gap: 7px;
}

.qty-btn {
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 8px;
  background: #eee;
}

.total-box {
  background: #fff;
  border-radius: 18px;
  padding: 15px;
  box-shadow: var(--shadow);
  margin-top: 15px;
}

.total-row {
  display: flex;
  justify-content: space-between;
  font-weight: 800;
  font-size: 18px;
}

/* ================= EMPTY ================= */

.empty {
  text-align: center;
  padding: 50px 20px;
  color: var(--muted);
}

.empty-icon {
  font-size: 50px;
  margin-bottom: 10px;
}

/* ================= TOAST ================= */

.toast {
  position: fixed;
  left: 15px;
  right: 15px;
  bottom: 85px;
  background: #202124;
  color: #fff;
  padding: 13px 15px;
  border-radius: 13px;
  text-align: center;
  z-index: 200;
  opacity: 0;
  transform: translateY(15px);
  pointer-events: none;
  transition: .25s;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

/* ================= RTL / LTR ================= */

html[dir="ltr"] body {
  direction: ltr;
}

html[dir="ltr"] .search-box input {
  padding: 15px 15px 15px 45px;
}

html[dir="ltr"] .search-box span {
  left: 15px;
  right: auto;
}

html[dir="ltr"] .badge {
  left: 30%;
  right: auto;
}

@media (min-width: 700px) {
  .modal {
    align-items: center;
  }

  .modal-box {
    border-radius: 25px;
  }

  .food-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}
</style>
</head>
<body>
<div id="app">

  <!-- ================= SPLASH ================= -->
  <section id="splash" class="screen splash-screen">
    <div class="splash-logo">وص</div>
    <h1>وصلي</h1>
    <p data-i18n="tagline">توصيل الطعام إلى بابك</p>
  </section>

  <!-- ================= LOGIN ================= -->
  <section id="loginScreen" class="screen login-screen" hidden>

    <div class="brand">
      <div class="brand-logo">وص</div>
      <h1>وصلي</h1>
      <p data-i18n="tagline">توصيل الطعام إلى بابك</p>
    </div>

    <div class="language-switch">
      <button type="button" id="langAr" class="lang-btn active">العربية</button>
      <button type="button" id="langFr" class="lang-btn">Français</button>
    </div>

    <div class="login-card">

      <h2 data-i18n="welcome">مرحباً بك</h2>
      <p class="muted" data-i18n="chooseRole">اختر نوع الحساب</p>

      <div class="role-grid">

        <button type="button" class="role-card active" data-role="client">
          <span class="role-icon">👤</span>
          <strong data-i18n="client">زبون</strong>
          <small data-i18n="clientHint">اطلب طعامك</small>
        </button>

        <button type="button" class="role-card" data-role="seller">
          <span class="role-icon">🏪</span>
          <strong data-i18n="seller">مطعم / بائع</strong>
          <small data-i18n="sellerHint">أدر مطعمك وطلباتك</small>
        </button>

        <button type="button" class="role-card" data-role="driver">
          <span class="role-icon">🚴</span>
          <strong data-i18n="driver">ديليفري</strong>
          <small data-i18n="driverHint">وصل الطلبات</small>
        </button>

      </div>

      <form id="loginForm">

        <div class="field">
          <label data-i18n="fullName">الاسم الكامل</label>
          <input id="loginName" type="text" autocomplete="name"
                 data-placeholder-ar="اكتب اسمك الكامل"
                 data-placeholder-fr="Votre nom complet"
                 placeholder="اكتب اسمك الكامل">
        </div>

        <div class="field">
          <label data-i18n="phone">رقم الهاتف</label>
          <input id="loginPhone" type="tel" inputmode="tel"
                 data-placeholder-ar="05xxxxxxxx"
                 data-placeholder-fr="05xxxxxxxx"
                 placeholder="05xxxxxxxx">
        </div>

        <div id="restaurantField" class="field" hidden>
          <label data-i18n="restaurantName">اسم المطعم</label>
          <input id="loginRestaurant" type="text"
                 data-placeholder-ar="مثال: مطعم بوسعادة"
                 data-placeholder-fr="Ex: Restaurant Boussaada"
                 placeholder="مثال: مطعم بوسعادة">
        </div>

        <div id="wilayaField" class="field">
          <label data-i18n="wilaya">الولاية</label>
          <select id="loginWilaya"></select>
        </div>

        <div id="addressField" class="field">
          <label data-i18n="address">عنوان التوصيل</label>
          <textarea id="loginAddress"
                    data-placeholder-ar="الحي، الشارع، رقم المنزل..."
                    data-placeholder-fr="Quartier, rue, numéro..."
                    placeholder="الحي، الشارع، رقم المنزل..."></textarea>
        </div>

        <button id="loginSubmitBtn" class="primary-btn full" type="submit">
          <span data-i18n="enterApp">دخول إلى وصلي</span>
        </button>

      </form>

      <p class="demo-note">
        <span data-i18n="demoNote">نسخة تجريبية: البيانات محفوظة على هذا الجهاز.</span>
      </p>

    </div>
  </section>

  <!-- ================= CUSTOMER APP ================= -->
  <section id="clientApp" class="app-screen" hidden>

    <header class="topbar">
      <div>
        <small data-i18n="deliveryTo">التوصيل إلى</small>
        <button type="button" id="clientWilayaBtn" class="location-btn">
          📍 <span id="clientWilayaText"></span>
        </button>
      </div>

      <button type="button" class="icon-btn" data-logout title="Logout">
        🚪
      </button>
    </header>

    <main id="clientContent" class="main-content"></main>

    <nav class="bottom-nav">
      <button type="button" class="nav-btn active" data-client-page="home">
        <span>🏠</span>
        <small data-i18n="home">الرئيسية</small>
      </button>

      <button type="button" class="nav-btn" data-client-page="cart">
        <span>🛒</span>

   حتى لا يتوقف التطبيق عن العمل.
*/

const memoryStore = {};

  getItem: function(key) {
    try {
      return localStorage.getItem(key);
    } catch (e) {
      return Object.prototype.hasOwnProperty.call(memoryStore, key)
        ? memoryStore[key]
        : null;
    }
  },
  setItem: function(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch (e) {
      memoryStore[key] = value;
    }
  },
  removeItem: function(key) {
    try {
      localStorage.removeItem(key);
    } catch (e) {
      delete memoryStore[key];
    }
  }
};

/* الذاكرة المحلية التي تُملأ تلقائياً وتبقى محدّثة لحظياً
   عبر مستمعي Firestore (onSnapshot). كل دوال renderXxx
   تبقى كما هي وتقرأ من db.restaurants / db.foods / db.orders
   دون أي تعديل عليها. */
let db = {
  users: [],
  restaurants: [],
  foods: [],
  orders: [],
  carts: {}
};

function mapSnapshot(snapshot) {
  return snapshot.docs.map(function(docSnap) {
    return Object.assign({ id: docSnap.id }, docSnap.data());
  });
}

function startRealtimeSync() {
  if (!firebaseReady) return;

  fsdb.collection("restaurants").onSnapshot(function(snapshot) {
    db.restaurants = mapSnapshot(snapshot);
    if (user) renderCurrentApp();
  }, function(error) {
    toast("Firestore (restaurants): " + error.message);
  });

  fsdb.collection("foods").onSnapshot(function(snapshot) {
    db.foods = mapSnapshot(snapshot);
    if (user) renderCurrentApp();
  }, function(error) {
    toast("Firestore (foods): " + error.message);
  });

  fsdb.collection("orders").onSnapshot(function(snapshot) {
    db.orders = mapSnapshot(snapshot).sort(function(a, b) {
      return (b.createdAtMs || 0) - (a.createdAtMs || 0);
    });
    if (user) renderCurrentApp();
  }, function(error) {
    toast("Firestore (orders): " + error.message);
  });
}

/* السلة تبقى محلية على كل جهاز (لا حاجة لمشاركتها بين الأدوار) */

function loadCarts() {
  try {
    const raw = safeStorage.getItem("wasli_carts");
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveCarts() {
  safeStorage.setItem("wasli_carts", JSON.stringify(db.carts));
}

db.carts = loadCarts();

/* ================= BASIC FUNCTIONS ================= */

function uid(prefix) {
  return prefix + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
}

function t(key) {
  return I[lang][key] || I.ar[key] || key;
}

function money(value) {
  return Number(value || 0).toFixed(2) + " DA";
}

function esc(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function getWilaya(code) {
  const item = WILAYAS.find(function(w) {
    return w[0] === code;
  });

  if (!item) return code || "";

  return lang === "ar" ? item[1] : item[2];
}

function getFoodName(food) {

function fillWilayaSelect(select, selected) {

  select.innerHTML = WILAYAS.map(function(w) {

      ? w[0] + " - " + w[1]
      : w[0] + " - " + w[2];

    return '<option value="' + esc(w[0]) + '"' +
      (w[0] === selected ? " selected" : "") +

function translatePage() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

  $$("[data-i18n]").forEach(function(el) {
    const key = el.getAttribute("data-i18n");

    if (I[lang][key]) {
      el.textContent = I[lang][key];
    }
  });

  $$("[data-placeholder-ar]").forEach(function(el) {
    el.placeholder = lang === "ar"
      ? el.getAttribute("data-placeholder-ar")
      : el.getAttribute("data-placeholder-fr");
  });

  $("#langAr").classList.toggle("active", lang === "ar");
  $("#langFr").classList.toggle("active", lang === "fr");

  fillWilayaSelect($("#loginWilaya"), $("#loginWilaya").value || "28");

  if ($("#changeWilayaSelect")) {

/* ================= LOGIN ================= */

async function findUserRemote(phone, selectedRole) {
  const snap = await fsdb.collection("users")
    .where("phone", "==", phone)
    .where("role", "==", selectedRole)
    .limit(1)
    .get();

  if (snap.empty) return null;

  const docSnap = snap.docs[0];
  return Object.assign({ id: docSnap.id }, docSnap.data());
}

function login() {
  loginInner().catch(function(error) {
    toast("خطأ أثناء الدخول: " + (error && error.message ? error.message : error));
  });
}

async function loginInner() {

  if (!firebaseReady) {
    toast(
      lang === "ar"
        ? "لم يتم ضبط Firebase بعد. راجع الخطوات المرسلة لك."
        : "Firebase n'est pas encore configuré."
    );
    return;
  }

  const name = $("#loginName").value.trim();
  const phone = $("#loginPhone").value.trim();
  const wilaya = $("#loginWilaya").value;
  const address = $("#loginAddress").value.trim();
  const restaurantName = $("#loginRestaurant").value.trim();

  if (!name || !phone || !wilaya) {
    toast(t("loginRequired"));
    return;
  }

  if (role === "client" && !address) {
    toast(t("customerAddressRequired"));
    return;
  }

  if (role === "seller" && !restaurantName) {
    toast(t("restaurantRequired"));
    return;
  }

  const existing = await findUserRemote(phone, role);

  if (existing) {

    const updates = {
      name: name,
      wilaya: wilaya
    };

    if (role === "client") {
      updates.address = address;
    }

    if (role === "seller") {
      updates.restaurantName = restaurantName;
    }

    await fsdb.collection("users").doc(existing.id).update(updates);

    user = Object.assign({}, existing, updates);

    if (role === "seller") {
      const restSnap = await fsdb.collection("restaurants")
        .where("ownerId", "==", user.id)
        .limit(1)
        .get();

      if (!restSnap.empty) {
        await restSnap.docs[0].ref.update({
          name: restaurantName,
          wilaya: wilaya
        });
      } else {
        await fsdb.collection("restaurants").add({
          ownerId: user.id,
          name: restaurantName,
          wilaya: wilaya
        });
      }
    }

  } else {

    const newUserData = {
      role: role,
      name: name,
      phone: phone,
      wilaya: wilaya
    };

    if (role === "client") {
      newUserData.address = address;
    }

    if (role === "seller") {
      newUserData.restaurantName = restaurantName;
    }

    if (role === "driver") {
      newUserData.online = false;
    }

    const newUserRef = await fsdb.collection("users").add(newUserData);

    user = Object.assign({ id: newUserRef.id }, newUserData);

    if (role === "seller") {
      await fsdb.collection("restaurants").add({
        ownerId: user.id,
        name: restaurantName,
        wilaya: wilaya
      });
    }
  }

  safeStorage.setItem(
    "wasli_session",
    JSON.stringify({
      userId: user.id,
      role: user.role
    })
  );

  renderCurrentApp();
  toast(lang === "ar" ? "تم تسجيل الدخول بنجاح" : "Connexion réussie");
}

/* ================= SESSION ================= */

async function restoreSession() {
  try {
    const raw = safeStorage.getItem("wasli_session");

    if (!raw) {
      showOnly("loginScreen");
      return;
    }

    if (!firebaseReady) {
      showOnly("loginScreen");
      return;
    }

    const session = JSON.parse(raw);

    const docSnap = await fsdb.collection("users").doc(session.userId).get();

    if (!docSnap.exists || docSnap.data().role !== session.role) {
      safeStorage.removeItem("wasli_session");
      showOnly("loginScreen");
      return;
    }

    user = Object.assign({ id: docSnap.id }, docSnap.data());
    role = user.role;

    renderCurrentApp();

  } catch (error) {
    safeStorage.removeItem("wasli_session");
    showOnly("loginScreen");
  }
}

/* ================= CART ================= */

function getCart() {
  if (!user || user.role !== "client") return [];

  return db.carts[user.id] || [];
}

function setCart(cart) {
  if (!user || user.role !== "client") return;

  db.carts[user.id] = cart;
  saveCarts();
}

function cartCount() {
  return getCart().reduce(function(sum, item) {
    return sum + item.qty;
  }, 0);
}

function cartTotal() {
  let total = 0;

  getCart().forEach(function(item) {
    total += item.price * item.qty;
  });

  return total;
}

/* ================= ADD TO CART ================= */

function addToCart(foodId) {

  const food = db.foods.find(function(f) {
    return f.id === foodId;
  });

  if (!food) return;

  const restaurantId = food.restaurantId;
  const cart = getCart();

  if (
    cart.length &&
    cart[0].restaurantId !== restaurantId
  ) {
    toast(t("cartOther"));
    return;
  }

  const existing = cart.find(function(item) {
    return item.foodId === foodId;
  });

  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({
      foodId: food.id,
      restaurantId: restaurantId,
      nameAr: food.nameAr,
      nameFr: food.nameFr,
      price: Number(food.price),
      qty: 1
    });
  }

  setCart(cart);
  updateCartBadge();

  toast(lang === "ar" ? "تمت الإضافة إلى السلة" : "Ajouté au panier");
}

      o.clientId === user.id;

  const updates = {};

/* ================= SELLER ================= */

function renderSeller() {

  const restaurant = getSellerRestaurant();

  $("#sellerRestaurantTitle").textContent =

  $$(".dash-tab").forEach(function(btn) {

  }

    html += `

    html += `
      <div class="order-card">

              #${esc(order.number)}
            </h3>

            <small>
              👤 ${esc(order.customerName)}
            </small>
          </div>

            ${esc(statusText(order.status))}

                </div>
              `;
            }).join("")
          }

        <div class="info-box">
          👤 <strong>${esc(t("customer"))}:</strong>
          ${esc(order.customerName)}<br>

          📞 <strong>${esc(t("phoneLabel"))}:</strong>
          ${esc(order.customerPhone)}<br>

          📍 <strong>${esc(t("deliveryAddress"))}:</strong>
          ${esc(order.customerAddress)}<br>

          ${
            order.note
              ? "📝 <strong>" +
                esc(t("orderNote")) +
                ":</strong> " +
                esc(order.note)
              : ""
          }
        </div>

        ${
          order.driverId
            ? `
              <div class="info-box">
                🚴 ${esc(t("driverName"))}:
                <strong>${esc(order.driverName)}</strong>

            `

            ? `

                <button

                  class="action-btn action-green"

                  type="button"
                  class="action-btn action-red"
                  data-seller-reject="${esc(order.id)}">
                  ✕ ${esc(t("reject"))}
                </button>

              </div>

/* ================= FOOD MODAL ================= */

function openFoodModal(foodId) {

  editingFoodId = foodId || null;

  const title = $("#foodModalTitle");

  if (editingFoodId) {

    const food = db.foods.find(function(f) {
      return f.id === editingFoodId;
    });

    if (!food) return;

    title.textContent = t("edit");

    $("#foodId").value = food.id;
    $("#foodName").value =
      lang === "ar" ? food.nameAr : food.nameFr;
    $("#foodPrice").value = food.price;
    $("#foodCategory").value = food.category;
    $("#foodDescription").value =
      lang === "ar"
        ? food.descriptionAr
        : food.descriptionFr;
    $("#foodImage").value = food.image || "";

  } else {

    title.textContent = t("addFood");

    $("#foodForm").reset();
    $("#foodId").value = "";

  }

  $("#foodModal").hidden = false;
}

function closeModal(id) {

  const modal = $("#" + id);

  if (modal) {
    modal.hidden = true;
  }
}

function saveFood() {
  saveFoodInner().catch(function(error) {
    toast("خطأ أثناء حفظ الطعام: " + (error && error.message ? error.message : error));
  });
}

async function saveFoodInner() {

  const restaurant = getSellerRestaurant();

  if (!restaurant) return;

  const name = $("#foodName").value.trim();
  const price = Number($("#foodPrice").value);
  const category = $("#foodCategory").value;
  const description = $("#foodDescription").value.trim();
  const image = $("#foodImage").value.trim();

  if (!name || !price) {
    toast(
      lang === "ar"
        ? "أكمل معلومات الطعام."
        : "Complétez les informations du plat."
    );
    return;
  }

  if (editingFoodId) {

    const food = db.foods.find(function(f) {
      return f.id === editingFoodId &&
        f.restaurantId === restaurant.id;
    });

    if (food) {

      const updates = {
        price: price,
        category: category,
        image: image
      };

      if (lang === "ar") {
        updates.nameAr = name;
        updates.descriptionAr = description;
      } else {
        updates.nameFr = name;
        updates.descriptionFr = description;
      }

      await fsdb.collection("foods").doc(food.id).update(updates);
    }

  } else {

    const food = {
      restaurantId: restaurant.id,
      nameAr: name,
      nameFr: name,
      price: price,
      category: category,
      descriptionAr: lang === "ar" ? description : "",
      descriptionFr: lang === "fr" ? description : "",
      image: image
    };

    await fsdb.collection("foods").add(food);
  }

  closeModal("foodModal");
  editingFoodId = null;

  renderSellerFoods();

  toast(t("foodSaved"));
}

/* ================= DELETE FOOD ================= */

function deleteFood(foodId) {
  deleteFoodInner(foodId).catch(function(error) {
    toast("خطأ أثناء الحذف: " + (error && error.message ? error.message : error));
  });
}

async function deleteFoodInner(foodId) {

  const restaurant = getSellerRestaurant();

  if (!restaurant) return;

  if (!confirm(t("deleteConfirm"))) {
    return;
  }

  await fsdb.collection("foods").doc(foodId).delete();

  renderSellerFoods();

  toast(t("foodDeleted"));
}

/* ================= SELLER ORDER ACTIONS ================= */

function sellerAccept(orderId) {

    toast("خطأ: " + (error && error.message ? error.message : error));
  });
}

async function sellerAcceptInner(orderId) {

function sellerReject(orderId) {

}

async function sellerRejectInner(orderId) {

  const restaurant = getSellerRestaurant();

  const order = db.orders.find(function(o) {

/* ================= DRIVER ================= */

  $("#driverTitle").textContent = user.name;

  const online = !!user.online;

  const availableOrders = db.orders.filter(function(order) {

    return (
      order.wilaya === user.wilaya &&
      order.status === "confirmed" &&
      !order.driverId
    );
  });

  const myOrders = db.orders.filter(function(order) {
    return order.driverId === user.id &&
      order.status === "onWay";
  });

  let html = `
    <div class="driver-status">

      <div class="online-row">

        <div>
          <strong>
            ${esc(
              online
                ? t("available")
                : t("offline")
            )}
          </strong>

          <div style="color:#777;font-size:12px;margin-top:5px;">
            📍 ${esc(getWilaya(user.wilaya))}
          </div>
        </div>

        <label class="switch">
          <input
            type="checkbox"
            id="driverOnlineToggle"
            ${online ? "checked" : ""}>
          <span class="slider"></span>
        </label>

      </div>

    </div>
  `;

  html += `
    <div class="section-title">
      <h3>${esc(t("deliveryRequests"))}</h3>
      <small>${availableOrders.length}</small>
    </div>
  `;

  if (!online) {

    html += `
      <div class="empty">
        <div class="empty-icon">🚴</div>
        <p>${esc(t("offline"))}</p>
      </div>
    `;

  } else if (!availableOrders.length) {

    html += `
      <div class="empty">
        <div class="empty-icon">📦</div>
        <p>${esc(t("emptyOrders"))}</p>
      </div>
    `;

  } else {

    availableOrders.forEach(function(order) {

      <div class="section-title">

}

        </div>

        ${esc(order.customerName)}<br>

        ${esc(order.customerPhone)}<br>

        ${esc(order.customerAddress)}<br>

        ${

        }

        ${

/* ================= DRIVER ACTIONS ================= */

function driverAccept(orderId) {
  driverAcceptInner(orderId).catch(function(error) {
    toast("خطأ: " + (error && error.message ? error.message : error));
  });
}

async function driverAcceptInner(orderId) {

  const order = db.orders.find(function(o) {

      o.status === "confirmed" &&
      !o.driverId &&
      o.wilaya === user.wilaya;
  });

  await fsdb.collection("orders").doc(orderId).update({
    driverId: user.id,
    driverName: user.name,

  });

  renderDriver();

  toast(t("driverAccepted"));

function driverReject(orderId) {

  const order = db.orders.find(function(o) {
    return o.id === orderId &&
      o.status === "confirmed" &&
      !o.driverId;
  });

  if (!order) return;

  toast(t("driverRejected"));

  renderDriver();
}

function driverComplete(orderId) {
  driverCompleteInner(orderId).catch(function(error) {
    toast("خطأ: " + (error && error.message ? error.message : error));
  });
}

async function driverCompleteInner(orderId) {

  const order = db.orders.find(function(o) {
    return o.id === orderId &&
      o.driverId === user.id &&
      o.status === "onWay";
  });

  if (!order) return;

  await fsdb.collection("orders").doc(orderId).update({
    status: "done",
    completedAt: new Date().toISOString()
  });

  renderDriver();

  toast(t("deliveryDone"));
}

/* ================= WILAYA ================= */

function openWilayaModal() {

  fillWilayaSelect(
    $("#changeWilayaSelect"),
    user.wilaya
  );

  $("#wilayaModal").hidden = false;
}

function saveWilaya() {
  saveWilayaInner().catch(function(error) {
    toast("خطأ: " + (error && error.message ? error.message : error));
  });
}

async function saveWilayaInner() {

  const newWilaya = $("#changeWilayaSelect").value;

  if (!newWilaya || !user) return;

  await fsdb.collection("users").doc(user.id).update({ wilaya: newWilaya });

  user.wilaya = newWilaya;

  if (user.role === "seller") {

    const restaurant = getSellerRestaurant();

    if (restaurant) {
      await fsdb.collection("restaurants").doc(restaurant.id).update({ wilaya: newWilaya });
    }
  }

  closeModal("wilayaModal");

  renderCurrentApp();

  toast(t("saved"));
}

/* ================= EVENT SYSTEM ================= */

document.addEventListener("click", function(event) {

  const target = event.target.closest("button");

  if (!target) return;

  /* ---------- LOGIN SUBMIT (click-based, works even if
     the sandboxed WebView blocks the native 'submit' event) ---------- */

  if (target.id === "loginSubmitBtn") {
    event.preventDefault();
    login();
    return;
  }

  /* ---------- FOOD SUBMIT (click-based, same reason) ---------- */

  if (target.id === "foodSubmitBtn") {
    event.preventDefault();
    saveFood();
    return;
  }

  /* ---------- LOGOUT ---------- */

  if (target.hasAttribute("data-logout")) {
    logout();
    return;
  }

  /* ---------- LANGUAGE ---------- */

  if (target.id === "langAr") {
    lang = "ar";
    safeStorage.setItem("wasli_lang", lang);
    translatePage();
    return;
  }

  if (target.id === "langFr") {
    lang = "fr";
    safeStorage.setItem("wasli_lang", lang);
    translatePage();
    return;
  }

  /* ---------- ROLE ---------- */

  if (target.hasAttribute("data-role")) {
    setRole(target.getAttribute("data-role"));
    return;
  }

  /* ---------- CLIENT NAV ---------- */

  if (target.hasAttribute("data-client-page")) {

    clientPage =
      target.getAttribute("data-client-page");

    renderClient();
    return;
  }

  /* ---------- CATEGORY ---------- */

  if (target.hasAttribute("data-category")) {

    clientCategory =
      target.getAttribute("data-category");

    renderClientHome();
    return;
  }

  /* ---------- ADD FOOD TO CART ---------- */

  if (target.hasAttribute("data-add-food")) {

    addToCart(
      target.getAttribute("data-add-food")
    );

    return;
  }

  /* ---------- CART PLUS ---------- */

  if (target.hasAttribute("data-cart-plus")) {

    const index = Number(
      target.getAttribute("data-cart-plus")
    );

    const cart = getCart();

    if (cart[index]) {
      cart[index].qty += 1;
      setCart(cart);
      renderClientCart();
      updateCartBadge();
    }

    return;
  }

  /* ---------- CART MINUS ---------- */

  if (target.hasAttribute("data-cart-minus")) {

    const index = Number(
      target.getAttribute("data-cart-minus")
    );

    const cart = getCart();

    if (!cart[index]) return;

    cart[index].qty -= 1;

    if (cart[index].qty <= 0) {
      cart.splice(index, 1);
    }

    setCart(cart);
    renderClientCart();
    updateCartBadge();

    return;
  }

  /* ---------- CHECKOUT ---------- */

  if (target.id === "checkoutBtn") {
    checkout();
    return;
  }

  /* ---------- PROFILE WILAYA ---------- */

  if (target.id === "profileWilayaBtn") {
    openWilayaModal();
    return;
  }

  /* ---------- CLIENT WILAYA ---------- */

  if (target.id === "clientWilayaBtn") {
    openWilayaModal();
    return;
  }

  /* ---------- SAVE WILAYA ---------- */

  if (target.id === "saveWilayaBtn") {
    saveWilaya();
    return;
  }

  /* ---------- CLOSE MODALS ---------- */

  if (target.hasAttribute("data-close-modal")) {

    closeModal(
      target.getAttribute("data-close-modal")
    );

    return;
  }

  /* ---------- SELLER TABS ---------- */

  if (target.hasAttribute("data-seller-tab")) {

    sellerTab =
      target.getAttribute("data-seller-tab");

    renderSeller();
    return;
  }

  /* ---------- ADD FOOD ---------- */

  if (target.id === "openAddFood") {
    openFoodModal(null);
    return;
  }

  /* ---------- EDIT FOOD ---------- */

  if (target.hasAttribute("data-edit-food")) {

    openFoodModal(
      target.getAttribute("data-edit-food")
    );

    return;
  }

  /* ---------- DELETE FOOD ---------- */

  if (target.hasAttribute("data-delete-food")) {

    deleteFood(
      target.getAttribute("data-delete-food")
    );

    return;
  }

  /* ---------- SELLER ACCEPT ---------- */

  if (target.hasAttribute("data-seller-accept")) {

    sellerAccept(
      target.getAttribute("data-seller-accept")
    );

    return;
  }

  /* ---------- SELLER REJECT ---------- */

  if (target.hasAttribute("data-seller-reject")) {

    sellerReject(
      target.getAttribute("data-seller-reject")
    );

    return;
  }

  /* ---------- DRIVER ACCEPT ---------- */

  if (target.hasAttribute("data-driver-accept")) {

    driverAccept(
      target.getAttribute("data-driver-accept")
    );

    return;
  }

  /* ---------- DRIVER REJECT ---------- */

  if (target.hasAttribute("data-driver-reject")) {

    driverReject(
      target.getAttribute("data-driver-reject")
    );

    return;
  }

  /* ---------- DRIVER COMPLETE ---------- */

  if (target.hasAttribute("data-driver-complete")) {

    driverComplete(
      target.getAttribute("data-driver-complete")
    );

    return;
  }

  /* ---------- FOOD RATING ---------- */

  if (target.hasAttribute("data-rate-food")) {

    rateOrder(
      target.getAttribute("data-rate-food"),
      "food",
      Number(target.getAttribute("data-rating"))
    );

    return;
  }

  /* ---------- DRIVER RATING ---------- */

  if (target.hasAttribute("data-rate-driver")) {

    rateOrder(
      target.getAttribute("data-rate-driver"),
      "driver",
      Number(target.getAttribute("data-rating"))
    );

    return;
  }

});

/* ================= FORMS ================= */

document.addEventListener("submit", function(event) {

  if (event.target.id === "loginForm") {

    event.preventDefault();
    login();
    return;
  }

  if (event.target.id === "foodForm") {

    event.preventDefault();
    saveFood();
    return;
  }

});

/* ================= DRIVER TOGGLE ================= */

document.addEventListener("change", function(event) {

  if (event.target.id === "driverOnlineToggle") {

    if (!user || user.role !== "driver") return;

    const checked = event.target.checked;

    fsdb.collection("users").doc(user.id).update({ online: checked })
      .then(function() {
        user.online = checked;
        renderDriver();
        toast(checked ? t("online") : t("offlineShort"));
      })
      .catch(function(error) {
        toast("خطأ: " + (error && error.message ? error.message : error));
      });

    return;
  }

});

document.addEventListener("click", function(event) {
